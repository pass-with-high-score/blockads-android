name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Install Android NDK & gomobile
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "ndk;26.1.10909125" "platforms;android-24"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          gomobile init
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          mkdir -p build/tunnel
          cd tunnel
          gomobile bind -target=android -androidapi 24 -trimpath \
            -ldflags='-s -w -buildid= -extldflags=-Wl,-z,max-page-size=16384' \
            -o "../build/tunnel/tunnel.aar" github.com/nqmgaming/blockads-tunnel

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew -Ptunnel.source=local :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockAds-Root-Transparent-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
