name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go vet & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tunnel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.5'
          cache-dependency-path: tunnel/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -short -cover ./...

      # Each Fuzz* target must run against its own package, so enumerate per package.
      # Keep going after a crash so one run reports every failing target.
      - name: Fuzz smoke (30s per target)
        shell: bash
        run: |
          failed=0
          for pkg in $(go list ./...); do
            listing=$(go test -list '^Fuzz' "$pkg")
            for target in $(grep '^Fuzz' <<<"$listing" || true); do
              echo "::group::$target ($pkg)"
              go test -run='^$' -fuzz="^${target}\$" -fuzztime="${FUZZTIME:-30s}" "$pkg" || failed=1
              echo "::endgroup::"
            done
          done
          exit $failed

      # A crash writes its input under testdata/fuzz/; commit it as a regression seed.
      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: tunnel/**/testdata/fuzz/
          retention-days: 7

  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
      # Forks set a repository variable TUNNEL_REPO pointing at their own
      # releases; unset resolves from upstream (see settings.gradle.kts).
      TUNNEL_REPO: ${{ vars.TUNNEL_REPO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # 21 for the unit-test toolchain (Robolectric's SDK 36 runtime); 17, listed last, stays the default.
          java-version: |
            21
            17
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
            ~/.gradle/daemon
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.5'
          cache: true

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          export PATH="$HOME/go/bin:$PATH"
          gomobile init

      - name: Add gomobile to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      # CI builds the tunnel from source so PRs touching tunnel/ are actually
      # compiled, rather than resolving the last published artifact.
      - name: Build Go Tunnel (tunnel.aar)
        run: ./gradlew -Ptunnel.source=local buildGoTunnel

      # Separately, prove the pinned release artifact still resolves and matches
      # gradle/tunnel.aar.sha256.
      - name: Verify published tunnel.aar
        run: ./gradlew verifyTunnelAar

      - name: Unit tests
        run: ./gradlew -Ptunnel.source=local :app:testDebugUnitTest :app:koverXmlReportUnit :app:koverLogUnit

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: app/build/reports/kover/reportUnit.xml
          retention-days: 7

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

      - name: Lint
        run: ./gradlew -Ptunnel.source=local lint

      - name: Build debug APK
        run: |
          ./gradlew --stop
          ./gradlew -Ptunnel.source=local assembleDebug

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockAds-arm64-v8a-debug
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          retention-days: 7

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockAds-armeabi-v7a-debug
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
          retention-days: 7

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockAds-x86_64-debug
          path: app/build/outputs/apk/debug/*x86_64*.apk
          retention-days: 7

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockAds-universal-debug
          path: app/build/outputs/apk/debug/*universal*.apk
          retention-days: 7
