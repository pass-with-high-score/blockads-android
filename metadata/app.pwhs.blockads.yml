Binaries: 
  https://github.com/pass-with-high-score/blockads-android/releases/download/v%v/app-universal-release.apk

Builds:
  - versionName: 6.1.4
    versionCode: 41
    commit: 08f96600f183392aeac23aa8e1b9d89097813e2f
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y golang-go gcc libc-dev make
    srclibs:
      - go@go1.23.5
    gradle:
      - yes
    output: build/outputs/apk/release/app-universal-release-unsigned.apk
    build:
      # tunnel.aar is not committed; it is normally resolved from a GitHub
      # Release. F-Droid builds it from tunnel/ below instead, and tells Gradle
      # to consume that build rather than fetching or rebuilding it.
      - echo "tunnel.source=prebuilt" >> ../gradle.properties
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export PATH="$$go$$/bin:$PATH"
      - sdkmanager 'platforms;android-24'
      - export GOPATH="$PWD/.gopath"
      - export PATH="$GOPATH/bin:$PATH"
      - export GOFLAGS="-buildvcs=false"
      - go version
      - go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
      - gomobile init
      - mkdir -p ../build/tunnel
      - cd ../tunnel
      - gomobile bind -target=android -androidapi 24 -trimpath -ldflags='-s -w -buildid=
        -extldflags=-Wl,-z,max-page-size=16384' -o ../build/tunnel/tunnel.aar github.com/nqmgaming/blockads-tunnel
    ndk: r26b

AllowedAPKSigningKeys: 229ea49584360b22a8c7e7e530cfb7e1103faa1b6ba5f32837691fb96fdcfe5a

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: app/build.gradle.kts|versionCode\s=\s(\d+)|.|versionName\s=\s"([\d.]+)"
